<!DOCTYPE html>
<html>
	<head>
		<meta charset=utf-8>
		<title>Neco Arc</title>
		<style>
			body { margin: 0; padding: 0; font-family: Consolas, monospace; }
			canvas { display: block; }
			#offset-panel {
				position: fixed; top: 10px; left: 10px; z-index: 10;
				background: rgba(20, 20, 24, 0.85); color: #eee;
				padding: 12px 14px; border-radius: 8px; width: 320px;
				font-size: 12px; user-select: none;
			}
			#offset-panel h3 { margin: 0 0 6px; font-size: 13px; }
			#offset-panel .hint { color: #9fd; margin: 0 0 10px; line-height: 1.35; }
			.row { display: flex; align-items: center; margin: 6px 0; }
			.row label { width: 14px; font-weight: bold; }
			.row input[type=range] { flex: 1; margin: 0 8px; }
			.row input[type=number] { width: 78px; background: #111; color: #eee;
				border: 1px solid #555; border-radius: 4px; padding: 2px 4px; font-family: inherit; }
			#offset-readout { background: #111; border: 1px solid #555; border-radius: 4px;
				padding: 8px; margin: 10px 0 0; white-space: pre-wrap; color: #9fe; }
			#offset-reset { margin-top: 8px; background: #333; color: #eee; border: 1px solid #666;
				border-radius: 4px; padding: 4px 10px; cursor: pointer; font-family: inherit; }
			#offset-reset:hover { background: #444; }
		</style>
	</head>
	<body>
		<div id="offset-panel">
			<h3>Head offset (NECO_OFFSET)</h3>
			<p class="hint">The grid is ground level in-game (1:1). The blue box is
			a to-scale kerbal body and the green box is the head zone where the
			stock head sits. Drag the head so it fills the green box, then copy the
			values below (or <code>deploy.ps1 -OffsetX/-OffsetY/-OffsetZ</code>).</p>
			<div class="row">
				<label>X</label>
				<input type="range" id="off-x" min="-1" max="1" step="0.001" value="0">
				<input type="number" id="num-x" step="0.001" value="0">
			</div>
			<div class="row">
				<label>Y</label>
				<input type="range" id="off-y" min="-1" max="1" step="0.001" value="0">
				<input type="number" id="num-y" step="0.001" value="0">
			</div>
			<div class="row">
				<label>Z</label>
				<input type="range" id="off-z" min="-1" max="1" step="0.001" value="0">
				<input type="number" id="num-z" step="0.001" value="0">
			</div>
			<button id="offset-reset">Reset to 0</button>
			<pre id="offset-readout"></pre>
		</div>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/102/three.js"></script>
		<script src="OrbitControls.js"></script>
        <script src="data.js"></script>
		<script src="viewer.js"></script>
	</body>
</html>
